    <meta name="description" content="DualBalance: un cuaderno de gastos personales para quien maneja pesos y dólares, con resumen mensual, gráficos y exportación a Excel." />
    <title>DualBalance · gestor de gastos</title>
    <script>
      // Applies the saved theme before the first paint, so a dark page does not flash white while the app loads.
      // Same rule as src/theme.ts: "light" and "dark" are stored; anything else follows the system.
      try {
        var stored = localStorage.getItem('gastos.theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
